[project]
name = "winam-api"
version = "0.1.0"
description = "FastAPI backend for WinamGames"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "bcrypt>=4.2.0",
]

[tool.uvicorn]
factory = false
